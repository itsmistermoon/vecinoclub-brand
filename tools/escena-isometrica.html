  /* ---------- VecinoClub brand palette — opt-in ---------- */
  --vc-background: #f3e6cf;
  --vc-card: #fcf4df;
  --vc-surface-raised: #fcf4df;
  --vc-foreground: #171717;
  --vc-muted-foreground: #59554e;
  --vc-border: #c6b29d;
  --vc-input: #fcf4df;
  --vc-input-border: #f3e6cf;
  --vc-primary: #fb772a;
  --vc-primary-hover: #ff8b47;
  --vc-gold: #fcbf29;
  --vc-primary-foreground: #171717;
  --vc-secondary: #ece4d1;
  --vc-secondary-foreground: #171717;
  --vc-placeholder: #d6c6b1;
  --vc-success: #2e7d32;
  --vc-danger: #b3261e;
  --vc-warning: #8a5a00;
  --vc-radius: 28px;
  --vc-gutter: clamp(22px, 5vw, 64px);
  --vc-ease: cubic-bezier(0.2, 0.75, 0.25, 1);
}
